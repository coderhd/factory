# Factory Server MVP runtime (spec §20). Docker Compose is the MVP runtime;
# persistent volumes hold Factory state, artifacts/evidence, and knowledge.
# Images use explicit versions, never `latest`.
#
# The pinned image is built from `Dockerfile` (`docker compose build`), so the
# `image:` ref has a real build path rather than an unbuilt registry tag.
#
# Trust boundary (E10.4, #40): when `server.auth` is configured in
# `factory.yaml`, every mutating control-plane route requires
# `Authorization: Bearer <token>` and the actor on human actions (approvals,
# interaction answers, pause/e-stop) is the authenticated principal — a request
# body's actor field is not trusted. The token is a deployment secret: mount or
# template it when composing the image and keep it out of version control, and
# the server never logs it. Read-only (GET) routes remain unauthenticated by
# decision; the loopback publish below still binds only the host, so widening
# access requires both this auth and a deliberate bind (see
# factory-docs/implementation/control-plane-auth.md).
services:
  factory:
    image: ghcr.io/coderhd/factory:0.1.0
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      # Mount onto the `.factory/*` storage paths `factory.yaml` declares, so the
      # volumes are the persistence the spec requires (not empty host paths).
      - factory-state:/app/.factory/state
      - factory-artifacts:/app/.factory/artifacts
      - factory-knowledge:/app/.factory/knowledge
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8787/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  factory-state:
  factory-artifacts:
  factory-knowledge:
