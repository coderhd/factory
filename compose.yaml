# Factory Server MVP runtime (spec §20). Docker Compose is the MVP runtime;
# persistent volumes hold Factory state, artifacts/evidence, and knowledge.
# Images use explicit versions, never `latest`.
#
# The pinned image is built from `Dockerfile` (`docker compose build`), so the
# `image:` ref has a real build path rather than an unbuilt registry tag.
#
# E10.4 (#40) trust boundary + FAIL-CLOSED container path. When `server.auth` is
# configured in `factory.yaml`, every mutating control-plane route requires
# `Authorization: Bearer <token>` and the actor on human actions is the
# authenticated principal — a request body's actor field is not trusted; the
# token is a deployment secret (template it into factory.yaml, keep it out of
# version control, never logged); read-only (GET) routes stay public by
# decision, and the publish below stays host-loopback-only. The image CMD binds
# `--hostname 0.0.0.0`, and the serve path REFUSES that bind unless the shipped
# factory.yaml carries `server.auth { token, actor }` — a deployment without
# auth fails at boot, never serves mutating routes unauthenticated. See
# factory-docs/implementation/control-plane-auth.md.
#
# E11.3 (#43): when factory.yaml carries a `github:` section, the deployment
# must export the token env variable it names (e.g. `FACTORY_GITHUB_TOKEN`,
# pass with `docker compose run -e FACTORY_GITHUB_TOKEN`) — the serve path
# refuses to start without it (fail closed); the token is never in this file.
services:
  factory:
    image: ghcr.io/coderhd/factory:0.1.0
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      # Mount onto the `.factory/*` storage paths `factory.yaml` declares, so the
      # volumes are the persistence the spec requires (not empty host paths).
      - factory-state:/app/.factory/state
      - factory-artifacts:/app/.factory/artifacts
      - factory-knowledge:/app/.factory/knowledge
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8787/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  factory-state:
  factory-artifacts:
  factory-knowledge:
