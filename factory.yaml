# Desired Factory deployment (spec §20). `factory.yaml` is *desired* config; the
# deployment manager resolves it into runtime config (`resolveFactoryConfig`),
# and `compose.yaml` is one rendering of that runtime. Not interchangeable.
#
# `#` comments are ignored by the parser; `factory init` rewrites this file
# without them, so keep operator notes short.
apiVersion: factory/v0.1
factoryVersion: 0.1.0
server:
  # Bind address for the API. 127.0.0.1 is local dev; a container passes
  # `--hostname 0.0.0.0` (or sets this) so the mapped port is reachable. A
  # non-loopback hostname requires `server.auth` (E10.4, #40) — the config
  # fails to load otherwise.
  hostname: 127.0.0.1
  port: 8787
  # Control-plane authentication (E10.4, #40), e.g. for a container deployment:
  #   auth:
  #     token: replace-with-a-random-secret-of-24-plus-characters
  #     actor: operator-ada
  # The token IS a deployment secret: generate it (`openssl rand -base64 32`),
  # keep it out of version control, and give it only to clients. When set,
  # every mutating route requires `Authorization: Bearer <token>`; read-only
  # (GET) routes stay public, and the `actor` — never a request-body actor —
  # signs the durable human-action receipts (approvals, answers, e-stop).
  # See factory-docs/implementation/control-plane-auth.md.
storage:
  # Relative paths resolve against the deployment directory. compose mounts
  # volumes onto these (`/app/.factory/*`).
  state: .factory/state
  artifacts: .factory/artifacts
  knowledge: .factory/knowledge
repository:
  # The local repository Task worktrees are created from.
  path: .
scheduler:
  maxConcurrentTasks: 3
  tickIntervalMs: 1000
  # Demand-driven worker population (spec §16). `max` is a capacity ceiling,
  # not an initial worker count; idle workers past `idleTimeoutMs` are reclaimed.
  provisioning:
    enabled: true
    min: 0
    max: 5
    idleTimeoutMs: 600000
    defaultProfile: herdr
worktrees:
  # Per-Task isolation (spec §15): each Task gets an isolated branch + worktree
  # under rootDir, branched from baseBranch.
  rootDir: .factory/worktrees
  baseBranch: main
workers:
  profiles:
    - herdr
  # E11.1 (#44): the worker runtime. `harness` is the coding agent started in
  # each Attempt's tab; `workspaceLabel` is the dedicated herdr workspace the
  # Factory owns (your focused panes/workspaces are never touched).
  harness: opencode
  workspaceLabel: factory
  # Capability → model map (#44): keys are E9.3's generic capability ids
  # (explorer, generalist, implementer, …), values the concrete opencode
  # models your deployment runs. Unmapped routed ids fail loud at dispatch.
  models:
    # Concrete opencode models for E9.3's generic capability ids. We run the two
    # primaries we develop Factory with (glm-5.3-flash, deepseek-v4.1-flash).
    # Frontier models are deliberately avoided (glm-5.3, qwen3.8-max, kimi-k3,
    # grok-4.7, gpt-6-luna); `frontier` is mapped to a primary so escalation
    # never reaches one. qwen3.8-flash is reserved for the semantic judge below
    # (writer ≠ verifier: the judge model must differ from every value here).
    explorer: opencode-go/deepseek-v4.1-flash
    generalist: opencode-go/glm-5.3-flash
    implementer: opencode-go/glm-5.3-flash
    independent-opinion: opencode-go/glm-5.3-flash
    loop-solver: opencode-go/deepseek-v4.1-flash
    reviewer: opencode-go/glm-5.3-flash
    planner: opencode-go/glm-5.3-flash
    frontier: opencode-go/glm-5.3-flash
    adversarial: opencode-go/glm-5.3-flash
    diversifier: opencode-go/glm-5.3-flash
# Outbound GitHub configuration (E11.3, #43). Optional: when present, `factory
# start` composes the GitHub adapter (import issues, open change-set PRs) from
# this section; absent, the GitHub routes 404 (fail closed). The token is a
# *reference* to an environment variable — never the token itself — so no
# secret is ever written to this file or logged; export the variable before
# starting (the server refuses to start without it).
# github:
#   repository: owner/name
#   token:
#     env: FACTORY_GITHUB_TOKEN
#   # apiBaseUrl: https://github.example.com/api/v3   # GitHub Enterprise, optional
#   # baseBranch: main                                 # PR base branch, optional (default main)
# Policy/rules configuration (E11.4, #41; ADR 14 §11). Optional: when present,
# this section is the deployment's policy source of truth and overrides the
# embedded defaults everywhere (scheduler assignment, the write-time repo.write
# path gate, every check). Absent, the embedded defaults stay authoritative —
# fail closed, unchanged. An invalid policy is rejected loudly at load and the
# server refuses to start; it is never silently degraded to a permissive
# default. Levels fold Org → Project → WO → Task with monotonic narrowing: a
# child can never widen a parent, and the deployment-fixed capability ceilings
# (production.write/secrets.read, production customer-data reads, production
# deploys) are engine-owned, not configurable in v0.1.
# policy:
#   version: v-deploy-1        # your own version string; '<embedded>' is reserved
#   organization:
#     capabilities:
#       repo.write:
#         - decision: allow
#           scope: { branchPattern: "wo-*/**", excludePaths: ["infra/**"] }
#       repo.read:
#         - decision: allow
#       secrets.read:
#         - decision: deny
#   projects:                    # keyed by the Work Order repository name
#     client-portal:
#       capabilities:
#         repo.write:
#           - decision: allow
#             scope: { paths: ["src/**", "docs/**"] }
# Each rule: `decision: allow|deny|require_human`, optional `scope` (paths /
# excludePaths globs, branchPattern, env: staging|production, dataClass:
# synthetic|customer-data), optional `ruleId`. Prefer a separate file:
# policyFile: ./policy.yaml    # either a policy section OR policyFile, never both

# Production verification (E10.1, #39; judge harness E11.2, #42). When present,
# the server composes the real E5 verifier (deterministic command checks + an
# independent semantic judge run as a fresh opencode harness) and drives a
# SUCCESS Task through verification to HUMAN_GATE. The judge identity MUST differ
# from every `workers.models` value (writer ≠ verifier) or the server refuses to
# start. The commands run in the Attempt's worktree.
verification:
  judge:
    # Different family from the implementers (glm-5.3-flash / deepseek-v4.1-flash).
    provider: opencode-go
    model: qwen3.8-flash
    family: qwen
    harness: opencode
  prompt:
    id: factory-verify
    version: "1"
  rubric:
    - Falsify each acceptance criterion against the change set, not the author's summary.
    - Inspect the diff and the deterministic results; report per-criterion pass/fail with evidence.
    - Treat anything you cannot verify from the change set as a failure, not a pass.
  checks:
    - id: typecheck
      category: deterministic
      kind: typecheck
      command: sh scripts/check-tsc.sh
    - id: unit
      category: deterministic
      kind: unit
      command: bun test
image:
  repository: ghcr.io/coderhd/factory
  tag: "0.1.0"
compose:
  healthcheck:
    intervalSeconds: 10
    timeoutSeconds: 5
    retries: 3
