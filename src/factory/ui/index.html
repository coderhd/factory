<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Factory</title>
    <link rel="stylesheet" href="/ui/styles.css" />
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <h1>Factory</h1>
        <button id="refresh" type="button">Refresh</button>
      </header>

      <!-- The read-first dashboard. Each panel owns its own container and its
           own fetch, so one failing surface renders an inline error in that
           panel and never blanks the others. -->
      <main id="dashboard">
        <section class="panel" id="work-orders" aria-labelledby="work-orders-heading">
          <h2 id="work-orders-heading">Work Orders</h2>
          <div class="panel-body" data-panel-body></div>
        </section>

        <section class="panel" id="observatory" aria-labelledby="observatory-heading">
          <h2 id="observatory-heading">Observatory</h2>
          <div class="panel-body" data-panel-body></div>
        </section>

        <section class="panel" id="approvals" aria-labelledby="approvals-heading">
          <h2 id="approvals-heading">Approvals</h2>
          <div class="panel-body" data-panel-body></div>
        </section>

        <section class="panel" id="interactions" aria-labelledby="interactions-heading">
          <h2 id="interactions-heading">Interactions</h2>
          <div class="panel-body" data-panel-body></div>
        </section>

        <section class="panel" id="scheduler" aria-labelledby="scheduler-heading">
          <h2 id="scheduler-heading">Scheduler</h2>
          <div class="panel-body" data-panel-body></div>
        </section>

        <section class="panel" id="controls" aria-labelledby="controls-heading">
          <h2 id="controls-heading">Factory controls</h2>
          <div class="panel-body" data-panel-body></div>
        </section>
      </main>

      <!-- The read-first Work Order detail (`#/wo/<id>`). Two areas, each with
           its own fetch and its own inline error: the snapshot body and the
           spec §23 drill-down chain. A failed snapshot leaves the chain usable
           and vice versa. -->
      <main id="detail" hidden>
        <p class="detail-back"><a href="#/">← All work orders</a></p>
        <h2 class="detail-heading">
          Work order <span id="detail-id"></span>
        </h2>
        <div id="detail-body" class="panel"></div>
        <section class="panel" aria-labelledby="detail-chain-heading">
          <h3 id="detail-chain-heading">Drill-down</h3>
          <ol id="detail-chain"></ol>
        </section>
      </main>
    </div>
    <script type="module" src="/ui/app.js"></script>
  </body>
</html>
